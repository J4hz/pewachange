<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#B43052" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Manrope: same family the live campaign site already used. Kept for brand
         continuity; loaded with swap + preconnect to protect LCP on 3G Android.
         Fraunces added as the display/headline serif for the premium pass —
         its optical-size axis stays crisp at large headline sizes. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />

    <title>Ombaka for Dagoretti North MP 2027</title>
    <!-- Static share tags. WhatsApp, Facebook and X don't run JavaScript, so
         the per-page tags from SEO.tsx never reach them; these do. data-rh
         lets react-helmet-async replace them in the browser instead of
         duplicating. Absolute URLs: keep the domain in sync with siteUrl in
         src/config/site.ts. -->
    <meta
      name="description"
      content="Ochieng (Pewa Change) Ombaka for Dagoretti North MP, 2027. You've paid. You deserve more. Join the accountability campaign for Kilimani, Gatina, Kabiro, Kawangware and Kileleshwa."
      data-rh="true"
    />
    <meta property="og:type" content="website" data-rh="true" />
    <meta property="og:site_name" content="Pewa Change" />
    <meta property="og:title" content="Ombaka for Dagoretti North MP 2027 | #PewaChange" data-rh="true" />
    <meta
      property="og:description"
      content="You've paid. You deserve more. Join the accountability campaign for Kilimani, Gatina, Kabiro, Kawangware and Kileleshwa."
      data-rh="true"
    />
    <meta property="og:url" content="https://pewachange.africa/" data-rh="true" />
    <meta property="og:image" content="https://pewachange.africa/og-image.jpg" data-rh="true" />
    <meta property="og:image:width" content="1200" data-rh="true" />
    <meta property="og:image:height" content="630" data-rh="true" />
    <meta name="twitter:card" content="summary_large_image" data-rh="true" />
    <meta name="twitter:title" content="Ombaka for Dagoretti North MP 2027 | #PewaChange" data-rh="true" />
    <meta
      name="twitter:description"
      content="You've paid. You deserve more. Join the accountability campaign for Kilimani, Gatina, Kabiro, Kawangware and Kileleshwa."
      data-rh="true"
    />
    <meta name="twitter:image" content="https://pewachange.africa/og-image.jpg" data-rh="true" />
  </head>
  <body class="bg-paper text-ink font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
